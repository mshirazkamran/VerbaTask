[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# SPA Fallback - Fix 404 on page reload
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Prevent caching of Service Worker and PWA Manifest
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Long-term cache immutable hashed assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
